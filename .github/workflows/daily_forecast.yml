name: Daily forecast
on:
  schedule:
    - cron: '30 0 * * *'   # 06:30 Bangladesh time, every day
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-forecast
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - name: Download the VRM Breakdown tab
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: VRM Breakdown
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python ml/fetch_sheet.py "$RUNNER_TEMP/breakdown.csv"
      - name: Train and forecast
        run: python ml/forecast.py "$RUNNER_TEMP/breakdown.csv" ml/reason_master.csv data
      - name: Commit updated data
        run: |
          git config user.name "vrm-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || (git commit -m "Daily forecast update" && git push)
